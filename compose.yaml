services:
  ai.api:
    build:
      context: .
      dockerfile: Services/AI/AI.API/Dockerfile
#    image: magicflexing/docai-ai-api:latest
    ports:
      - "5003:5003"
    restart: always
    networks:
      - docai_network

  auth.api:
    build:
      context: .
      dockerfile: Services/Auth/Auth.API/Dockerfile
#    image: magicflexing/docai-auth-api:latest
    ports:
      - "5001:5001"
    restart: always
    networks:
      - docai_network

  apigateway1:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
#    image: magicflexing/docai-gateway:latest
    ports:
      - "5000:5000"
    restart: always
    depends_on:
      - auth.api
      - document.api
      - ai.api
      - notification.api
    networks:
      - docai_network

  apigateway2:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
#    image: magicflexing/docai-gateway:latest
    ports:
      - "5005:5000"
    restart: always
    depends_on:
      - auth.api
      - document.api
      - ai.api
      - notification.api
    networks:
      - docai_network

  document.api:
    build:
      context: .
      dockerfile: Services/Document/Document.API/Dockerfile
#    image: magicflexing/docai-document-api:latest
    ports:
      - "5002:5002"
    restart: always
    networks:
      - docai_network

  notification.api:
    build:
      context: .
      dockerfile: Services/Notification/Notification.API/Dockerfile
#    image: magicflexing/docai-notification-api:latest
    ports:
      - "5004:5004"
    restart: always
    networks:
      - docai_network
  chatbox.api:
    build:
      context: .
      dockerfile: Services/ChatBox/ChatBox.API/Dockerfile
    #    image: magicflexing/docai-notification-api:latest
    ports:
      - "5006:5006"
    restart: always
    networks:
      - docai_network

networks:
  docai_network:
    driver: bridge


#  apphost:
#    image: magicflexing/docai-apphost:latest
#    ports:
#      - "5005:8080"

